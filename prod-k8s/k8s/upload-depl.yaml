# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-depl
  namespace: default
  labels:
    app: upload
spec:
  selector:
    matchLabels:
      app: upload
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: upload
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name: upload-cloudly
        image: ayubsh/upload-cloudly
        imagePullPolicy: IfNotPresent
        env:
          - name: REDIS_URI
            value: 'redis://redis-srv:6379'
      restartPolicy: Always
---
# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: upload-srv
  namespace: default
spec:
  selector:
    app: upload
  type: ClusterIP
  ports:
  - name: upload-srv
    protocol: TCP
    port: 5001
    targetPort: 5001
---

